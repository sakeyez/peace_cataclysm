plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    // 仅用于调用森罗 1.6.0 的公开锅具 API；运行时由整合包提供，不打入附属 jar。
    compileOnly files('libs/kaleidoscopecookery-1.6.0-neoforge+mc1.21.1.jar')
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.test)
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verifyChallengeStore', JavaExec) {
    group = 'verification'
    description = 'Run the dependency-free Challenge Store and Ignis state checks.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.sake_yez.culinarycataclysm.challenge.ChallengeStoreCheck'
}
tasks.named('check') { dependsOn tasks.named('verifyChallengeStore') }
processResources {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
